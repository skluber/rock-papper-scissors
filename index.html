<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Rock Paper Scissors</h1>

    <div class="scoreboard">
        <div class="score-box">
            <h2>Player</h2>
            <div id="player-score" class="score-number">0</div>
        </div>
        <div class="divider">:</div>
        <div class="score-box">
            <h2>Computer</h2>
            <div id="computer-score" class="score-number">0</div>
        </div>
    </div>

    <div class="battle-arena">
        <div class="choice-display">
            <h3>Player</h3>
            <div id="player-choice-icon" class="icon-placeholder">?</div>
        </div>
        <div class="vs">VS</div>
        <div class="choice-display">
            <h3>Machine</h3>
            <div id="machine-choice-icon" class="icon-placeholder">?</div>
        </div>
</div>


    <div id="status-text">¿Con qué empezamos?</div>

    <div id="controls">
        <button data-choice="piedra">Piedra</button>
        <button data-choice="papel">Papel</button>
        <button data-choice="tijera">Tijera</button>
    </div>
</body>
</html>
